<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Experiment 3 - AJAX Data Retrieval</title>
    <style>
        table {
            width: 50%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        button {
            padding: 8px 15px;
            font-size: 16px;
        }
    </style>
</head>
<body>

<h2>Student Information</h2>
<button onclick="loadData()">Load Student Data</button>

<table id="studentTable">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
        </tr>
    </thead>
    <tbody>
        <!-- Data will be inserted here -->
    </tbody>
</table>

<script>
    function loadData() {
        fetch("students.json")
            .then(response => response.json())
            .then(data => {
                const tableBody = document.querySelector("#studentTable tbody");
                tableBody.innerHTML = "";

                data.forEach(student => {
                    const row = `
                        <tr>
                            <td>${student.id}</td>
                            <td>${student.name}</td>
                            <td>${student.age}</td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            })
            .catch(error => {
                console.error("Error loading data:", error);
            });
    }
</script>

</body>
</html>
